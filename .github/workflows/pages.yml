name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync
          uv run dbt deps

      - name: Build and test the warehouse (DuckDB)
        run: DBT_PROFILES_DIR=. uv run dbt build

      - name: Generate dbt docs (static)
        run: DBT_PROFILES_DIR=. uv run dbt docs generate --static

      - name: Assemble site
        run: ./scripts/build_site.sh

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
