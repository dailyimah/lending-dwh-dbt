version: 2

models:
  - name: dim_customer
    description: >
      Unified customer dimension (individual + company), SCD Type 2. One row per customer version;
      key customer_key = customer_id#sequence_no. A version opens whenever the source record or the
      credit score changes.
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]
  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]
  - name: dim_loan_type
    columns:
      - name: loan_type_id
        tests: [unique, not_null]
  - name: dim_movement_status
    columns:
      - name: movement_id
        tests: [unique, not_null]
      - name: status_name
        tests:
          - not_null
          - accepted_values: {values: ['requested','approved','rejected','cancelled','funding','disbursed','repaid','written_off','unmapped','unknown']}
  - name: dim_partner
    columns:
      - name: partner_id
        tests: [unique, not_null]
