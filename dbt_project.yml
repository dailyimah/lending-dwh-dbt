name: fazz_dwh
version: 1.0.0
config-version: 2
profile: fazz_dwh

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # --- Parameters (single place; see README "grounded or parameterized") ---
  # DPD buckets follow the OJK convention for fintech lending portfolio quality.
  dpd_bucket_edges: [1, 31, 61, 91]        # current | 1-30 | 31-60 | 61-90 | >90
  tkb_threshold_days: 90                    # TKB90 line
  unknown_member_key: "UNKNOWN"             # dim member for orphaned FKs
  direct_channel_key: "DIRECT"              # dim_partner member for non-partner loans
  scd_open_end: "9999-12-31"
  reporting_timezone: "Asia/Jakarta"        # WIB; sources normalized to UTC in staging

models:
  fazz_dwh:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    warehouse:
      +materialized: table
      +schema: warehouse
    marts:
      +materialized: table
      +schema: marts

seeds:
  fazz_dwh:
    +schema: raw
