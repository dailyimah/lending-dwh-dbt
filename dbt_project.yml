name: fazz_dwh
version: 1.0.0
config-version: 2
profile: fazz_dwh

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  reporting_timezone: "Asia/Jakarta"   # naive DATETIME sources are assumed to be Jakarta wall-clock time
  as_of_date: "2026-08-21"             # reporting horizon; synthetic data runs up to this date (prod: run date)
  amount_tolerance: 1                  # IDR rounding tolerance for "fully paid" / "fully settled" flags

models:
  fazz_dwh:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    warehouse:
      +materialized: table
      +schema: warehouse
    marts:
      +materialized: table
      +schema: marts

seeds:
  fazz_dwh:
    +schema: raw
