[project]
name = "lending-dwh-dbt"
version = "1.0.0"
description = "Fazz Data Engineer case study - lending data warehouse (dbt, BigQuery-targeted, runs locally on DuckDB)"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
]

[project.optional-dependencies]
bigquery = ["dbt-bigquery>=1.10"]

[tool.uv]
package = false
